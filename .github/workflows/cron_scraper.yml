name: Actualisation Automatique des Taux

on:
  schedule:
    # S'exécute à 06:00 et 18:00 UTC chaque jour
    - cron: '0 0 * * *'
  workflow_dispatch: # Permet de forcer manuellement depuis l'interface GitHub

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Exécution du script de filtrage des taux
        run: node filter.js

      - name: Sauvegarde et Push sur GitHub
        run: |
          git config --global user.name "GitHub Action Scraper"
          git config --global user.email "action@github.com"
          git add taux.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour des taux filtrés (Frankfurter)" && git push)
